name: Continuous Integration (CI)

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up Python 3.11
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"
        cache: "pip"

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Lint Code with Ruff
      run: |
        ruff check .

    - name: Check Formatting with Ruff
      run: |
        ruff format --check .

    - name: Run Test Suite
      run: |
        pytest tests/ -v --durations=10

    - name: Verify API Service Import
      run: |
        python -c "from api.main import app; print('FastAPI application initialized successfully')"

  docker-build-test:
    runs-on: ubuntu-latest
    needs: lint-and-test

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Build API Docker Image
      run: |
        docker build -f Dockerfile.api -t telco-churn-api:test .

    - name: Build Dashboard Docker Image
      run: |
        docker build -f Dockerfile.dashboard -t telco-churn-dashboard:test .
