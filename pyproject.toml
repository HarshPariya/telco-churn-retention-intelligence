[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "telco-churn-retention"
version = "1.0.0"
description = "Production Customer Churn Prediction and Retention Optimization Platform"
authors = [{ name = "Senior ML Engineering Team", email = "ml-engineering@telco-retention.ai" }]
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pandas>=2.2.0",
    "numpy>=1.26.0",
    "scikit-learn>=1.4.0",
    "xgboost>=2.0.0",
    "lightgbm>=4.3.0",
    "imbalanced-learn>=0.12.0",
    "shap>=0.45.0",
    "mlflow>=2.11.0",
    "fastapi>=0.110.0",
    "pydantic>=2.6.0",
    "pydantic-settings>=2.2.0",
    "uvicorn>=0.28.0",
    "streamlit>=1.32.0",
    "pyyaml>=6.0.1",
    "python-dotenv>=1.0.1",
    "joblib>=1.3.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
pythonpath = ["."]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --strict-markers --durations=10"

[tool.ruff]
target-version = "py311"
line-length = 100
[tool.ruff.lint]
select = [
    "E",  # pycodestyle errors
    "W",  # pycodestyle warnings
    "F",  # pyflakes
    "I",  # isort
    "C4", # flake8-comprehensions
    "B",  # flake8-bugbear
]
ignore = [
    "E501", # line too long (handled by formatter)
    "E402", # module level import not at top of file (scripts adjust sys.path)
    "B008", # do not perform function calls in argument defaults (FastAPI Depends)
    "W291", # trailing whitespace in multi-line strings / markdown
    "W293", # blank line contains whitespace
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
ignore_missing_imports = true
